# Baut das EarnWatch-Image für Umbrel & Co. (Intel/AMD + Raspberry Pi) und legt es auf ghcr.io ab.
name: Docker-Image
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/docker-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: app
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/kryptostar10-source/earnwatch:latest
            ghcr.io/kryptostar10-source/earnwatch:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=EarnWatch – passive income dashboard
