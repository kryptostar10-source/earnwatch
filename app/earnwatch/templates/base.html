<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>{% block title %}EarnWatch{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
</head>
<body>
{% if user %}
<header class="top">
  <a href="/" class="brand"><img src="/static/icon.svg" alt="" width="22" height="22"> EarnWatch</a>
  <nav>
    <a href="/" {% if request.url.path == '/' %}aria-current="page"{% endif %}>Übersicht</a>
    <a href="/settings" {% if request.url.path == '/settings' %}aria-current="page"{% endif %}>Einstellungen</a>
    <form method="post" action="/logout" class="inline">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button class="link">Abmelden</button>
    </form>
  </nav>
</header>
{% endif %}
<main class="{% block mainclass %}wrap{% endblock %}">
{% if flash %}<div class="flash {{ flash.kind }}" role="status">{{ flash.msg }}</div>{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
