{% extends "base.html" %}
{% block title %}Anmelden · EarnWatch{% endblock %}
{% block auth %}
<form method="post" class="card authcard" autocomplete="on">
  <div class="brand"><span class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0a0d11" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg></span><span><b>EarnWatch</b><small>Bitte anmelden</small></span></div>
  {% if flash %}<div class="flash {{ flash.kind }}">{{ flash.msg }}</div>{% endif %}
  {% if error %}<div class="flash err">{{ error }}</div>{% endif %}
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Benutzername<input name="username" required autocomplete="username" maxlength="32" autofocus></label>
  <label>Passwort<input name="password" type="password" required autocomplete="current-password" maxlength="256"></label>
  <label class="check"><input type="checkbox" name="remember" value="1"> Auf diesem Gerät angemeldet bleiben (empfohlen fürs iPhone)</label>
  <button class="btn primary">Anmelden</button>
</form>
{% endblock %}
