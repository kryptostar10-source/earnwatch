# EarnWatch – sicheres Einnahmen-Dashboard (Honeygain + EarnApp)
# Start:            docker compose up -d --build
# Earn-Apps: in der .env per COMPOSE_PROFILES einschalten, z. B.
#   COMPOSE_PROFILES=honeygain,earnapp,pawns,earnfm

name: earnwatch

services:
  # --- Dashboard (nur intern erreichbar, kein Port nach außen) -------------
  earnwatch:
    build: ./app
    image: earnwatch:local
    container_name: earnwatch
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Berlin}
      EW_SETUP_TOKEN: ${EW_SETUP_TOKEN:?EW_SETUP_TOKEN in .env setzen}
      EW_INTERVAL_MIN: ${EW_INTERVAL_MIN:-60}
      EW_SECURE_COOKIES: "true"
    volumes:
      - earnwatch_data:/data
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 100

  # --- HTTPS-Eingang mit eigener IP im Heimnetz -----------------------------
  caddy:
    image: caddy:2.10-alpine
    container_name: earnwatch-caddy
    restart: unless-stopped
    depends_on: [earnwatch]
    environment:
      EW_IP: ${EW_IP:?EW_IP in .env setzen}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      lan:
        ipv4_address: ${EW_IP}
      backend: {}
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 100

  # --- Optional: die Earn-Apps selbst (über COMPOSE_PROFILES in der .env) ----
  honeygain:
    profiles: [earners, honeygain]
    image: honeygain/honeygain:latest
    container_name: honeygain
    restart: unless-stopped
    command: -tou-accept -email ${HG_EMAIL} -pass ${HG_PASSWORD} -device ${HG_DEVICE:-proxmox}
    networks: [earners]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 100

  earnapp:
    profiles: [earners, earnapp]
    image: fazalfarhan01/earnapp:lite
    container_name: earnapp
    restart: unless-stopped
    environment:
      EARNAPP_UUID: ${EARNAPP_UUID}
      EARNAPP_TERM: "yes"
    volumes:
      - earnapp_data:/etc/earnapp
    networks: [earners]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 200

  pawns:
    profiles: [pawns]
    image: iproyal/pawns-cli:latest
    container_name: pawns
    restart: unless-stopped
    command: -email=${PAWNS_EMAIL} -password=${PAWNS_PASSWORD} -device-name=${PAWNS_DEVICE:-proxmox} -device-id=${PAWNS_DEVICE:-proxmox} -accept-tos
    networks: [earners]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 100

  earnfm:
    profiles: [earnfm]
    image: earnfm/earnfm-client:latest
    container_name: earnfm
    restart: unless-stopped
    environment:
      EARNFM_TOKEN: ${EARNFM_TOKEN}
    networks: [earners]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 100

networks:
  # Eigene IP im Heimnetz (macvlan)
  lan:
    driver: macvlan
    driver_opts:
      parent: ${EW_PARENT_IF:-eth0}
    ipam:
      config:
        - subnet: ${EW_SUBNET:-192.168.1.0/24}
          gateway: ${EW_GATEWAY:-192.168.1.1}
  # Internes Netz zwischen Caddy und App (App braucht Internet für die APIs)
  backend: {}
  # Earn-Apps getrennt vom Dashboard – festes Netz, damit lan-guard.sh das Heimnetz sperren kann
  earners:
    ipam:
      config:
        - subnet: 172.31.250.0/24

volumes:
  earnwatch_data:
  caddy_data:
  caddy_config:
  earnapp_data:
